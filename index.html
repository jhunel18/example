<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUP Student Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Enrollment System</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/grades">Grades</a></li>
            </ul>
        </nav>
    </header>
    <main>
       <form action="/api/enroll" method="post"> 
  <fieldset> 
    <legend>Student Enrollment 1</legend> 
  
    <label for="fullName">Full Name</label> 
    <input type="text" id="fullName" name="fullName" 
           required minlength="2" placeholder="Juan Dela Cruz"> 
  
    <label for="email">PUP Email</label> 
    <input type="email" id="email" name="email" required 
           placeholder="juan.delacruz@pup.edu.ph"> 
  
    <label for="mobile">Mobile Number</label> 
    <input type="tel" id="mobile" name="mobile" 
           pattern="09[0-9]{9}" title="Format: 09XXXXXXXXX"> 
  
    <label for="units">Units to Enroll</label> 
    <input type="number" id="units" name="units" min="1" max="27"> 
  
    <label for="program">Program</label> 
    <select id="program" name="program" required> 
      <option value="">-- Select a program --</option> 
      <option value="BSIT">BS Information Technology</option> 
      <option value="BSCS">BS Computer Science</option> 
    </select> 
  
    <button type="submit">Submit Enrollment</button> 
  </fieldset> 
</form> 
    </main>
    <script src="app.js"></script>
</body>

</html>
